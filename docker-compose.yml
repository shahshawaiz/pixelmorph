services:
  backend:
    container_name: backend
    hostname: backend
    build:
      context: ./backend  # Specify the build context
      dockerfile: Dockerfile  # Specify the Dockerfile if it's named differently
    ports:
      - "8765:8765" # fastAPI web server
    stdin_open: true  # Equivalent to -i
    tty: true         # Equivalent to -t
    env_file:
      - ./.env  # Path to the .env file
    # volumes:
    #   - ./backend/app:/app      
    # restart: always
    networks:
      - webnet      
      
  frontend:
    container_name: frontend
    hostname: frontend
    build:
      context: ./frontend  # Specify the build context
      dockerfile: Dockerfile  # Specify the Dockerfile if it's named differently
    ports:
      - "443:3000" # fastAPI web server
    stdin_open: true  # Equivalent to -i
    tty: true         # Equivalent to -t
    env_file:
      - ./frontend/.env  # Path to the .env file
    restart: always
    # volumes:
    #   - ./frontend/app:/app
    networks:
      - webnet  

  cms:
    container_name: cms
    hostname: cms
    build:
      context: ./cms
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    env_file:
      - ./cms/.env  # Path to the .env file
    volumes:
      # Mount the Strapi project files (for development live reload)
      # - ./cms/app:/srv/app
      # Persist the database data
      - ./cms/data:/srv/app/data
    restart: always
    networks:
      - webnet

  # ngrok-bgremover:
  #   container_name: ngrok-bgremover
